<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinguaMemo — Flashcards intelligentes pour apprendre les langues</title>
  <meta name="description" content="Apprenez les langues avec des flashcards intelligentes et sur-mesure, propulsées par l'IA." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <!-- Umami Analytics -->
  <script defer src="https://stats.crea-dapp.com/script.js" data-website-id="6e3b1c30-6f43-4129-8af1-bb3dcdf89f70"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:    #7C3AED;
      --purple-lt: #EDE9FE;
      --indigo:    #4F46E5;
      --dark:      #0F0E17;
      --gray:      #6B7280;
      --gray-lt:   #F3F4F6;
      --white:     #FFFFFF;
      --radius:    16px;
    }

    body { font-family: 'Inter', sans-serif; color: var(--dark); background: var(--white); line-height: 1.6; }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 5%;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #F0EEF8;
    }
    .logo { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; color: var(--dark); text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--purple); }
    .lang-toggle { display: flex; gap: 4px; background: var(--gray-lt); border-radius: 8px; padding: 4px; }
    .lang-toggle button { border: none; background: transparent; cursor: pointer; padding: 5px 12px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--gray); transition: all 0.2s; }
    .lang-toggle button.active { background: var(--white); color: var(--purple); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

    /* ── HERO ── */
    .hero { text-align: center; padding: 96px 5% 80px; background: linear-gradient(160deg, #FAFAFA 0%, #EDE9FE 50%, #EEF2FF 100%); }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: var(--purple-lt); color: var(--purple); padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 600; margin-bottom: 28px; }
    h1 { font-family: 'Sora', sans-serif; font-size: clamp(32px, 5vw, 56px); font-weight: 800; line-height: 1.15; letter-spacing: -1px; max-width: 760px; margin: 0 auto 20px; }
    h1 em { font-style: normal; color: var(--purple); }
    .hero-sub { font-size: clamp(16px, 2vw, 20px); color: var(--gray); max-width: 560px; margin: 0 auto 40px; }
    .cta-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--purple); color: var(--white); padding: 15px 28px; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 20px rgba(124,58,237,0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,58,237,0.4); }
    .btn-secondary { display: inline-flex; align-items: center; gap: 8px; background: var(--white); color: var(--dark); padding: 15px 28px; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none; border: 1.5px solid #E5E7EB; transition: border-color 0.2s, transform 0.2s; }
    .btn-secondary:hover { border-color: var(--purple); transform: translateY(-2px); }

    /* ── LANGUAGES STRIP ── */
    .languages-strip { background: var(--white); padding: 32px 5%; text-align: center; border-bottom: 1px solid #F0EEF8; }
    .languages-strip p { font-size: 13px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }
    .flags { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; align-items: center; }
    .flag-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--dark); }
    .flag-item span:first-child { font-size: 24px; }
    .flag-more { font-size: 13px; color: var(--purple); font-weight: 600; background: var(--purple-lt); padding: 4px 12px; border-radius: 100px; }

    /* ── FEATURES ── */
    .features { padding: 96px 5%; max-width: 1100px; margin: 0 auto; }
    .section-label { text-align: center; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--purple); text-transform: uppercase; letter-spacing: 0.08em; }
    h2 { font-family: 'Sora', sans-serif; font-size: clamp(26px, 4vw, 40px); font-weight: 800; text-align: center; letter-spacing: -0.5px; margin-bottom: 60px; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }

    .feature-card { background: var(--gray-lt); border-radius: var(--radius); padding: 32px 28px; transition: transform 0.2s, box-shadow 0.2s; }
    .feature-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.07); }
    .feature-card.accent { background: linear-gradient(135deg, var(--purple) 0%, var(--indigo) 100%); color: var(--white); }
    .feature-card.accent .feature-desc { color: rgba(255,255,255,0.8); }

    /* Feature icon — carré avec icône SVG */
    .feature-icon { width: 48px; height: 48px; background: var(--white); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); color: var(--purple); }
    .feature-card.accent .feature-icon { background: rgba(255,255,255,0.2); box-shadow: none; color: var(--white); }

    .feature-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .feature-desc { font-size: 14px; color: var(--gray); line-height: 1.65; }

    /* ── API SECTION ── */
    .api-section { background: linear-gradient(160deg, #0F0E17 0%, #1E1B4B 100%); color: var(--white); padding: 96px 5%; }
    .api-section .section-label { color: #A78BFA; }
    .api-section h2 { color: var(--white); }
    .api-section h2 em { font-style: normal; color: #A78BFA; }
    .api-intro { text-align: center; font-size: 16px; color: rgba(255,255,255,0.65); max-width: 620px; margin: -40px auto 56px; }

    .providers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto 48px; }
    .provider-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius); padding: 28px 24px; transition: background 0.2s, border-color 0.2s; }
    .provider-card:hover { background: rgba(255,255,255,0.1); border-color: rgba(167,139,250,0.4); }
    .provider-logo { width: 40px; height: 40px; border-radius: 10px; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .provider-name { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
    .provider-free { display: inline-flex; align-items: center; gap: 5px; background: rgba(52,211,153,0.15); color: #34D399; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 100px; }

    .api-note { text-align: center; font-size: 14px; color: rgba(255,255,255,0.5); max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 18px 24px; }

    /* ── CTA BOTTOM ── */
    .cta-section { padding: 96px 5%; text-align: center; background: var(--purple-lt); }
    .cta-section h2 { margin-bottom: 16px; }
    .cta-section p { font-size: 16px; color: var(--gray); max-width: 480px; margin: 0 auto 36px; }

    /* ── FOOTER ── */
    footer { padding: 32px 5%; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-top: 1px solid #F0EEF8; font-size: 13px; color: var(--gray); }

    @media (max-width: 640px) {
      .hero { padding: 64px 5% 56px; }
      .features { padding: 64px 5%; }
      .api-section, .cta-section { padding: 64px 5%; }
      footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>

<script>
  function setLang(lang) {
    document.querySelectorAll('.lang-toggle button').forEach(btn => {
      btn.classList.toggle('active', btn.textContent === lang.toUpperCase());
    });
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-fr]').forEach(el => {
      const text = el.getAttribute('data-' + lang);
      if (text !== null) el.innerHTML = text;
    });
  }
  setLang('fr');
</script>
